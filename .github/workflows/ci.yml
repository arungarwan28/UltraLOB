name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: engine · tests · parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build engine, tests, CLI, benchmark
        run: cmake --build build --parallel

      - name: GoogleTest suites
        run: ctest --test-dir build --output-on-failure

      - name: Reliability scenarios (fault injection)
        run: ./build/ultralob_cli chaos

      - name: Deterministic replay self-check
        run: ./build/ultralob_cli verify --events 200000 --seed 7 --workload balanced

      - name: C++ / Python parity
        run: python3 tests/parity_test.py --events 20000 --seed 7 --workload balanced

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: warn

  console:
    name: console · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # web/public/wasm/ultralob.wasm is the checked-in engine build, so the
      # console can be built without an Emscripten toolchain in CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build
